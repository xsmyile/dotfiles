name: searxng

services:
  core:
    container_name: searxng-core
    image: docker.io/searxng/searxng:latest
    restart: always
    ports:
      - "${SEARXNG_HOST:-127.0.0.1}:${SEARXNG_PORT:-8080}:${SEARXNG_PORT:-8080}"
    env_file: ./.env
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?Set SEARXNG_SECRET in .env}
      FORCE_OWNERSHIP: "false"
      GRANIAN_WORKERS: 2
      GRANIAN_RESPAWN_FAILED_WORKERS: "true"
      GRANIAN_WORKERS_MAX_RSS: 512
    healthcheck:
      test:
        - CMD
        - wget
        - -qO-
        - http://127.0.0.1:${SEARXNG_PORT:-8080}/healthz
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      valkey:
        condition: service_healthy
    volumes:
      - ./core-config/:/etc/searxng/:ro,Z
      - core-data:/var/cache/searxng/

  valkey:
    container_name: searxng-valkey
    image: docker.io/valkey/valkey:latest
    command: valkey-server --save 30 1 --loglevel warning
    restart: always
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 60s
      timeout: 3s
      retries: 3
    volumes:
      - valkey-data:/data/

volumes:
  core-data:
  valkey-data:
